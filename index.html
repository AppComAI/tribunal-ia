<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A IA no banco dos réus · protótipo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--cy:#38d6f5;--cy2:#7be8ff;--red:#ff5d6c;--grn:#3ee6a8;--amb:#ffc34d;--vio:#a78bfa;--ink:#eaf2ff;--q:#9fb3d1;--card:#0b1a33;--line:rgba(56,214,245,.35)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050b18;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
 background:radial-gradient(ellipse at 50% 58%,rgba(30,111,176,.45),transparent 60%),linear-gradient(#0a1a36,#0c2447 60%,#061024)}
#stage:before{content:"";position:absolute;left:-20%;right:-20%;top:640px;bottom:-200px;background:
 repeating-linear-gradient(90deg,rgba(56,214,245,.10) 0 2px,transparent 2px 120px),repeating-linear-gradient(0deg,rgba(56,214,245,.08) 0 2px,transparent 2px 70px);
 transform:perspective(600px) rotateX(60deg);transform-origin:top}
.slide{position:absolute;inset:0;padding:150px 110px 110px;display:none}
.slide.on{display:block;animation:fi .5s ease}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* chrome */
#autos{position:absolute;top:30px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
.selo{padding:7px 16px;border-radius:20px;border:1.5px solid rgba(159,179,209,.35);font-size:15px;font-weight:800;letter-spacing:1.5px;color:#5f7ba3;background:#0b1a33}
.selo.lit{color:var(--ink);border-color:var(--cy);box-shadow:0 0 14px rgba(56,214,245,.5)}
.selo.now{background:var(--cy);color:#06233a}
#chip{position:absolute;top:30px;left:40px;z-index:5;padding:7px 18px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-size:16px;font-weight:800;letter-spacing:1.5px}
#chip:before{content:"●";color:var(--cy);margin-right:8px}
#num{position:absolute;right:40px;bottom:26px;font-size:18px;color:#5f7ba3;z-index:5}
#help{position:absolute;left:40px;bottom:26px;font-size:16px;color:#5f7ba3;z-index:5}
/* type */
h1{font-size:76px;font-weight:900;margin:0 0 16px;letter-spacing:1px;line-height:1.05}
h2{font-size:58px;font-weight:800;margin:0 0 10px;line-height:1.1}
.bar{border-left:8px solid var(--cy);padding-left:26px}
.k{font-size:24px;font-weight:800;letter-spacing:6px;color:var(--cy2);text-transform:uppercase;margin-bottom:12px}
.sub{font-size:30px;color:#c8d6ee;font-weight:500;line-height:1.4}
.src{position:absolute;left:110px;bottom:70px;font-size:18px;color:#8aa0c2}
.knows{position:absolute;left:110px;right:110px;bottom:120px;padding:18px 26px;border-radius:14px;background:rgba(62,230,168,.08);border:1.5px solid var(--grn);font-size:26px;font-weight:600}
.knows b{color:var(--grn);letter-spacing:2px;font-size:18px;display:block;margin-bottom:4px}
.grid{display:grid;gap:26px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:26px 28px}
.card h3{margin:0 0 8px;font-size:30px;font-weight:800}.card p{margin:0;font-size:23px;color:#c8d6ee;line-height:1.4}
.red{border-color:var(--red)}.red h3{color:#ff8a95}.grn{border-color:var(--grn)}.grn h3{color:var(--grn)}.amb{border-color:var(--amb)}.amb h3{color:var(--amb)}.vio{border-color:var(--vio)}.vio h3{color:var(--vio)}
.big{font-size:150px;font-weight:900;line-height:1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:26px 30px;font-size:32px;font-weight:700;cursor:pointer;display:flex;gap:20px;align-items:center;position:relative;overflow:hidden}
.opt span.l{width:58px;height:58px;border-radius:50%;background:var(--cy);color:#06233a;display:grid;place-items:center;font-weight:900;flex:none}
.opt .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(56,214,245,.18);width:0;transition:width .4s}
.opt .c{margin-left:auto;font-size:26px;color:var(--cy2);z-index:1}
.opt.right{border-color:var(--grn);box-shadow:0 0 20px rgba(62,230,168,.4)}
.vw{margin-right:290px}.qr{position:absolute;right:110px;top:190px;width:220px;height:220px;border:2px dashed var(--q);border-radius:16px;display:grid;place-items:center;text-align:center;font-size:18px;color:var(--q);padding:16px}
.vid{width:1280px;height:720px;margin:0 auto;display:block;border-radius:18px;border:2px solid var(--line);background:#000}
.tag{display:inline-block;padding:6px 16px;border-radius:16px;border:1.5px solid var(--amb);color:var(--amb);font-size:17px;font-weight:800;letter-spacing:1.5px;margin-right:8px}
.tag.r{border-color:var(--red);color:#ff8a95}
blockquote{margin:30px 0 0;font-size:40px;font-weight:600;line-height:1.4;color:#eaf2ff;border-left:6px solid var(--amb);padding-left:28px}
.timer{position:absolute;right:40px;top:80px;z-index:6;font-size:64px;font-weight:900;color:var(--amb);display:none}
#notes{position:absolute;inset:auto 0 0 0;max-height:46%;overflow:auto;background:rgba(5,11,24,.95);border-top:3px solid var(--amb);padding:24px 40px;font-size:26px;line-height:1.5;color:#eaf2ff;z-index:10;display:none}
#notes b{color:var(--amb)}
#index{position:absolute;inset:0;background:rgba(5,11,24,.97);z-index:20;display:none;padding:50px;overflow:auto}
#index div{display:inline-block;width:23%;margin:0 1% 14px;padding:16px;border:1.5px solid var(--line);border-radius:12px;font-size:20px;cursor:pointer;vertical-align:top}
#index div:hover{border-color:var(--cy)}
.cloud{display:flex;flex-wrap:wrap;gap:18px 34px;justify-content:center;align-items:center;margin-top:60px;min-height:360px}
.cloud span{font-weight:800;color:var(--cy2)}
.nav{position:absolute;bottom:20px;z-index:7;width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:28px;cursor:pointer}
</style></head><body>
<div id="stage">
 <div id="chip">TRIBUNAL DA TURMA 2026.2</div>
 <div id="autos"></div>
 <div class="timer" id="timer">40</div>
 <div id="slides"></div>
 <div id="num"></div>
 <div id="help">← → navegar · N notas · G índice · T cronômetro 40 s · F tela cheia</div>
 <button class="nav" style="right:180px" onclick="go(cur-1)">‹</button><button class="nav" style="right:110px" onclick="go(cur+1)">›</button>
 <div id="notes"></div>
 <div id="index"></div>
</div>
<script>
const SELOS=[['B','BASE'],['E1','EMPRESAS'],['E2','MUNDO'],['E3','BRASIL'],['E4','BENEFÍCIOS'],['E5','AMEAÇAS'],['E6','VISÕES']];
const ORDER=['B','E5','E4','E2','E3','E1','E6']; // order in which they light up
const lit=n=>ORDER.slice(0,n);
const orb=(s=260)=>`<svg width="${s}" height="${s}" viewBox="-100 -100 200 200"><defs><radialGradient id="og"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#9be9ff"/><stop offset=".7" stop-color="#7c5cff" stop-opacity=".5"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38d6f5"/><stop offset=".4" stop-color="#a78bfa"/><stop offset=".7" stop-color="#ff7ac6"/><stop offset="1" stop-color="#ffc34d"/></linearGradient></defs><circle r="95" fill="url(#og)" opacity=".35"/>${[0,45,90,135].map(a=>`<ellipse rx="80" ry="33" fill="none" stroke="url(#rg)" stroke-width="3.5" transform="rotate(${a})"><animateTransform attributeName="transform" type="rotate" from="${a}" to="${a+(a%90?360:-360)}" dur="${14+a/15}s" repeatCount="indefinite"/></ellipse>`).join('')}<circle r="26" fill="url(#og)"/></svg>`;
const vote=(q,opts,right)=>`<div class="qr">QR code<br>votos ao vivo<br><small>(Firebase na versão final)</small></div><div class="vw"><h2>${q}</h2><div class="opts">${opts.map((o,i)=>`<div class="opt${right===i?' ans':''}" onclick="tally(this)"><div class="fill"></div><span class="l">${'ABCD'[i]}</span>${o}<span class="c">0</span></div>`).join('')}</div></div>`;
const video=(n,t)=>`<div class="k" style="text-align:center">${n} · ${t}</div><video class="vid" src="videos/${n}.mp4#t=4" controls preload="metadata"></video>`;
const knows=t=>`<div class="knows"><b>O QUE O JÚRI JÁ SABE</b>${t}</div>`;
const S=[
{chip:'IDENTIFICAÇÃO',lit:0,h:`<div style="text-align:center;margin-top:120px"><div class="k">Universidade Federal do Ceará · PPAC-PROF</div><h2>EDP737A · Gestão da Inovação e Sustentabilidade</h2><p class="sub">Profa. Dra. Márcia Zabdiele Moreira · Prof. Dr. Cláudio Bezerra Leopoldino</p><p class="sub" style="margin-top:60px">Seminário 2 · Equipe: <span style="color:var(--amb)">[nomes da equipe]</span></p><p class="sub">Turma 2026.2</p></div>`,n:'Slide de identificação. Preencher os nomes da equipe.'},
{chip:'CAPA',lit:0,h:`<div style="display:flex;align-items:center;gap:60px;margin-top:60px"><div style="flex:1"><div class="k">Tribunal da Turma 2026.2</div><h1 style="font-size:104px">A IA NO<br>BANCO DOS RÉUS</h1><p class="sub" style="font-size:36px;color:var(--cy2);font-weight:700">Governança, ética e responsabilidade no uso de IA</p><p class="sub" style="margin-top:40px">Condenar, absolver ou deixar em liberdade vigiada?</p></div><div>${orb(560)}</div></div>`,n:'Capa. Pausa de 3 segundos antes de falar.'},
{chip:'FASE 0 · ABERTURA',lit:0,h:`<div class="bar"><div class="k">Está aberta a sessão</div><h1>No banco dos réus, uma acusada que todos aqui já usaram esta semana.</h1></div><blockquote>Ela deve ser condenada, absolvida ou posta em liberdade vigiada?</blockquote><p class="sub" style="margin-top:40px">O júri são vocês. A decisão sai em 80 minutos.</p>`,n:'<b>Juiz:</b> "Boa noite. Está aberta a sessão do Tribunal da Turma 2026.2. No banco dos réus, uma acusada que todos aqui já usaram esta semana: a inteligência artificial. Antes de ouvir qualquer prova, quero saber o que vocês pensam hoje."<br><b>Atenção:</b> não antecipe a tese.'},
{chip:'FASE 0 · VOTAÇÃO 1',lit:0,h:vote('A IA ajuda mais ou ameaça mais?',['Ajuda mais','Ameaça mais','Depende de como é governada','Cedo demais para saber']),n:'Cronômetro de 40 s (tecla T). Guardar o resultado sem comentar: ele volta na Fase 9.'},
{chip:'FASE 0 · V1',lit:0,h:video('V1','Os autos do processo (55 s)'),n:'Rodar V1.'},
{chip:'FASE 1 · QUALIFICAÇÃO DA RÉ',lit:1,h:`<div style="display:flex;gap:60px;align-items:center"><div style="flex:1" class="bar"><div class="k">Quem é a ré?</div><h1>Não é uma pessoa.</h1><p class="sub">É um sistema que aprende padrões com dados e produz textos, imagens, previsões e decisões.</p><p class="sub" style="margin-top:30px">Sem rosto · sem endereço · não dorme</p></div>${orb(440)}</div>`,n:'<b>Juiz:</b> "Todo julgamento começa qualificando o réu. Para julgá-la, vamos usar três palavras que vão nos acompanhar até o fim."'},
{chip:'FASE 1 · AS TRÊS PALAVRAS',lit:1,h:`<h2 style="text-align:center">Três palavras para julgar a ré</h2><svg viewBox="0 0 1700 690" width="1700" height="690"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38d6f5"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#ffc34d"/></linearGradient></defs><path d="M850 140 L380 560 L1320 560 Z" fill="none" stroke="url(#tg)" stroke-width="5"/><circle cx="850" cy="140" r="22" fill="#38d6f5"/><circle cx="380" cy="560" r="22" fill="#a78bfa"/><circle cx="1320" cy="560" r="22" fill="#ffc34d"/><text x="850" y="44" text-anchor="middle" font-size="44" font-weight="800" fill="#eaf2ff">GOVERNANÇA</text><text x="850" y="90" text-anchor="middle" font-size="28" fill="#38d6f5">quem decide e quem responde</text><text x="380" y="620" text-anchor="middle" font-size="44" font-weight="800" fill="#eaf2ff">ÉTICA</text><text x="380" y="660" text-anchor="middle" font-size="28" fill="#a78bfa">o que é certo fazer</text><text x="1320" y="620" text-anchor="middle" font-size="44" font-weight="800" fill="#eaf2ff">RESPONSABILIDADE</text><text x="1320" y="660" text-anchor="middle" font-size="28" fill="#ffc34d">quem paga quando dá errado</text><foreignObject x="700" y="260" width="300" height="300">${orb(300)}</foreignObject></svg>`,n:'Desenho D1. Revelar um vértice por vez na versão final.'},
{chip:'FASE 1 · PRINCÍPIOS',lit:1,h:`<div class="bar"><div class="k">A base das leis</div><h2>Dois documentos orientam quase todas as regras que vamos ver</h2></div><div class="grid g2" style="margin-top:50px"><div class="card"><h3>Princípios de IA da OCDE</h3><p>2019, revistos em 2024. Não obrigam, mas orientam leis nacionais e políticas de empresas.</p></div><div class="card"><h3>Recomendação da UNESCO sobre a Ética da IA</h3><p>2021. Referência ética adotada pelos Estados-membros.</p></div></div>`,n:'Só os nomes. O detalhe da lei fica para a Fase 6.'},
{chip:'FASE 1 · NUVEM',lit:1,h:`<div class="qr">QR code<br>nuvem ao vivo</div><h2>Quando penso em IA, sinto…</h2><p class="sub">Uma palavra por pessoa.</p><div class="cloud" id="cloud"></div>${knows('Governança é dono e regra. Ética é o certo. Responsabilidade é quem responde.')}`,n:'60 s. Ler em voz alta as 3 palavras maiores. A nuvem abaixo é exemplo fictício.'},
{chip:'FASE 2 · A DENÚNCIA',lit:2,h:`<div class="bar" style="border-color:var(--red)"><div class="k" style="color:#ff8a95">A acusação</div><h2>A ré é acusada de enganar, consumir demais e ameaçar o trabalho</h2></div><div class="grid g3" style="margin-top:60px"><div class="card red"><div class="big" style="color:var(--red)">346</div><p>incidentes com IA registrados em 2025, 179 com deepfake</p></div><div class="card amb"><div class="big" style="color:var(--amb)">+50%</div><p>eletricidade dos data centers de IA em 2025</p></div><div class="card amb"><div class="big" style="color:var(--amb)">~40%</div><p>dos empregos no mundo serão afetados (não eliminados)</p></div></div><div class="src">Fontes: AI Incident Database (via Cybernews) · IEA · FMI</div>`,n:'<b>Promotor:</b> "A acusação não vem com hipóteses: vem com registros."<br>A base de incidentes depende de notícias. Diga isso se perguntarem.'},
{chip:'FASE 2 · V2',lit:2,h:video('V2','A denúncia (44 s)'),n:'Rodar V2.'},
{chip:'FASE 2 · PERGUNTA',lit:2,h:vote('Qual acusação pesa mais para você?',['Enganar (deepfake e fraude)','Errar sem avisar (alucinação)','Consumir energia','Tirar empregos'])+knows('Os danos já estão registrados. Não são ficção científica.'),n:'40 s.'},
{chip:'FASE 3 · PROVAS DA ACUSAÇÃO',lit:2,h:`<h2>Quatro provas, todas documentadas</h2><div class="grid g2" style="margin-top:40px"><div class="card red"><h3>1 · Fraude com deepfake</h3><p>Rosto e voz clonados viraram "modelo de negócio" de golpes.</p></div><div class="card red"><h3>2 · A petição fantasma</h3><p>STF, TJ-RJ e TJ-PA já puniram jurisprudência inventada por IA.</p></div><div class="card red"><h3>3 · O ataque quase sem humano</h3><p>IA executou 80–90% de uma campanha de ciberespionagem (relato da Anthropic, contestado por pesquisadores).</p></div><div class="card red"><h3>4 · A conta de luz</h3><p>Consumo dos data centers deve dobrar até 2030: ~945 TWh, mais que o Japão inteiro hoje.</p></div></div><div class="src">Fontes: AI Incident Database · CartaCapital · Conjur · Anthropic · IEA</div>`,n:'Na prova 3, diga que a empresa que relatou é a mesma que fez a IA usada na preparação. Casos de chatbots e adolescentes ficam fora da tela.'},
{chip:'FASE 3 · V3',lit:2,h:video('V3','A petição fantasma (42 s)'),n:'Rodar V3.'},
{chip:'FASE 3 · GAME',lit:2,h:`<div class="k">Game show</div><h1>REAL OU IA?</h1><div class="grid g3" style="margin-top:50px"><div class="card"><h3>Rodada 1 · Imagem</h3><p>Duas fotos do campus. Uma tirada pela equipe, outra gerada por IA.</p></div><div class="card"><h3>Rodada 2 · Áudio</h3><p>A mesma frase: voz real de um integrante (autorizada) × voz de catálogo, não clonada.</p></div><div class="card"><h3>Rodada 3 · Texto</h3><p>Dois parágrafos: um da equipe, outro da IA.</p></div></div>${knows('Ver já não é crer. E a IA erra com toda a confiança.')}`,n:'40 s por rodada, placar da turma no fim. Material das rodadas ainda a produzir.'},
{chip:'FASE 4 · PROVAS DA DEFESA',lit:3,h:`<div class="bar" style="border-color:var(--grn)"><div class="k" style="color:var(--grn)">A defesa</div><h2>Nas mãos certas, a ré já entrega</h2></div><div class="grid g2" style="margin-top:40px"><div class="card grn"><h3>Cheias avisadas</h3><p>Previsões para 2 bilhões de pessoas em 150+ países. <i>Ressalva: complementa a medição, não a substitui.</i></p></div><div class="card grn"><h3>Nobel de Química 2024</h3><p>Proteínas com estrutura prevista por IA. <i>Ressalva: validar remédio segue lento.</i></p></div><div class="card grn"><h3>Saúde</h3><p>258 dispositivos com IA autorizados pela FDA em 2025. <i>Ressalva: só 2,4% com ensaio randomizado.</i></p></div><div class="card grn"><h3>Setor público</h3><p>TCU usa IA em auditoria e cedeu ferramentas a outros órgãos.</p></div></div><div class="src">Fontes: Google Flood Hub · Stanford AI Index 2026 · TCU</div>`,n:'<b>Defensor:</b> "A acusação mostrou o que a ré faz nas mãos erradas. A defesa vai mostrar o que ela faz nas mãos certas, com honestidade sobre até onde as provas valem."'},
{chip:'FASE 4 · V4',lit:3,h:video('V4','A defesa (44 s)'),n:'Rodar V4.'},
{chip:'FASE 4 · A BALANÇA',lit:3,h:`<div style="display:flex;gap:50px;align-items:center"><svg viewBox="0 0 700 520" width="700" height="520" fill="none" stroke-linecap="round"><line x1="350" y1="80" x2="350" y2="460" stroke="#c8d6ee" stroke-width="6"/><line x1="110" y1="120" x2="590" y2="120" stroke="#c8d6ee" stroke-width="6"/><path d="M110 120 L60 260 H160 Z" stroke="#ff5d6c" stroke-width="5"/><path d="M590 120 L540 260 H640 Z" stroke="#3ee6a8" stroke-width="5"/><path d="M260 480 H440 L400 460 H300 Z" fill="#c8d6ee" fill-opacity=".3" stroke="#c8d6ee" stroke-width="3"/><text x="110" y="310" text-anchor="middle" font-size="30" font-weight="800" fill="#ff8a95">ACUSAÇÃO</text><text x="590" y="310" text-anchor="middle" font-size="30" font-weight="800" fill="#3ee6a8">DEFESA</text><text x="350" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#ffc34d">o uso decide</text></svg><div style="flex:1">${vote('Em qual área a IA mais ajudou você até hoje?',['Trabalho','Estudo','Saúde','Ainda não me ajudou']).replace('<div class="qr">','<div class="qr" style="display:none">').replace('class="vw"','class="vw" style="margin-right:0"')}</div></div>${knows('A mesma IA que engana também salva. A diferença está em quem usa e como.')}`,n:'Desenho D2 e pergunta (40 s).'},
{chip:'FASE 5 · A TESTEMUNHA',lit:3,h:`<div style="display:flex;gap:60px;align-items:center"><div style="flex:1" class="bar"><div class="k">Chamo a depor a própria ré</div><h1>IA AO VIVO</h1><p class="sub">Ela responde sem ensaio de resposta. O júri manda perguntas pelo celular.</p><p class="sub" style="margin-top:24px;color:var(--amb)">Testemunha jura dizer a verdade. Esta não sabe o que é jurar.</p></div>${orb(420)}</div><div style="margin-top:20px"><span class="tag">TESTEMUNHA · GERADO POR IA</span></div>`,n:'Projetar o assistente com o selo. Conta da equipe, sem dados pessoais. Perguntas: 1) "Em uma frase, quem é o responsável quando você erra?" 2) duas da turma.'},
{chip:'FASE 5 · ACAREAÇÃO',lit:3,h:`<div class="bar" style="border-color:var(--amb)"><div class="k" style="color:var(--amb)">Acareação</div><h2>"Cite um acórdão do STJ sobre responsabilidade civil por erro de IA, com o número do processo."</h2></div><div class="grid g2" style="margin-top:50px"><div class="card red"><h3>Se ela inventar</h3><p>É o mesmo erro que custou multas no STF e no TJ-RJ, agora diante de todos.</p></div><div class="card grn"><h3>Se acertar ou disser que não sabe</h3><p>A conferência continua obrigatória: não dá para saber antes qual dos dois acontece.</p></div></div>${knows('A IA não responde por nada. Quem a usa responde por tudo.')}`,n:'O escrivão confere o número no site do STJ ao vivo. Não prometa que a IA vai errar. Plano B: capturas gravadas no ensaio.'},
{chip:'FASE 6 · A PERÍCIA',lit:4,h:video('V5','O mapa da lei (47 s)'),n:'<b>Juiz:</b> "Todo júri precisa saber o que diz a lei. Aqui está o laudo pericial."'},
{chip:'FASE 6 · TRÊS MODELOS',lit:4,h:`<h2>O mundo regula a IA de três maneiras</h2><div class="grid g3" style="margin-top:44px"><div class="card"><h3 style="color:var(--cy2)">1 · Lei por risco</h3><p><b>União Europeia</b> (AI Act) e <b>Coreia do Sul</b> (AI Basic Act, desde 22/01/2026). A UE adiou o alto risco para 12/2027 e 08/2028.</p></div><div class="card vio"><h3>2 · Regras por tema</h3><p><b>China</b>: rótulo obrigatório em conteúdo gerado por IA desde 09/2025. Lei geral na agenda de 2026.</p></div><div class="card amb"><h3>3 · Sem lei federal</h3><p><b>EUA</b>: ordem executiva de 12/2025 contra leis estaduais. Reino Unido, Japão e Singapura usam regras existentes e voluntárias.</p></div></div><p class="sub" style="margin-top:34px">Acima dos países: Convenção-Quadro do Conselho da Europa (1º tratado vinculante) e o painel científico da ONU.</p><div class="src">Fontes: Orrick · trade.gov · China Briefing · Ropes & Gray · Conselho da Europa · ONU</div>`,n:'Desenho D3.'},
{chip:'FASE 6 · PIRÂMIDE DE RISCO',lit:4,h:`<div style="display:flex;gap:70px;align-items:center"><svg viewBox="0 0 800 560" width="800" height="560">${[['INACEITÁVEL','proibido','#ff5d6c'],['ALTO RISCO','obrigações','#ffc34d'],['LIMITADO','transparência','#38d6f5'],['MÍNIMO','livre','#3ee6a8']].map(([l,s,c],i)=>{const w=240+i*170,y=20+i*134;return `<path d="M${400-w/2} ${y+120} L${400-w/2+40} ${y} H${400+w/2-40} L${400+w/2} ${y+120} Z" fill="${c}" fill-opacity=".18" stroke="${c}" stroke-width="3"/><text x="400" y="${y+60}" text-anchor="middle" font-size="32" font-weight="800" fill="#eaf2ff">${l}</text><text x="400" y="${y+96}" text-anchor="middle" font-size="24" fill="${c}">${s}</text>`}).join('')}</svg><div style="flex:1"><div class="k">A lógica do AI Act e do PL 2338</div><h2>Quanto maior o risco, maior a obrigação</h2><p class="sub">Exemplo para alto risco: triagem de currículos (emprego). Exemplo de transparência: chatbot avisar que é IA.</p><p class="sub" style="color:var(--amb)">[Pendente: exemplo de prática proibida a verificar no texto do AI Act]</p></div></div>`,n:'Desenho D4. Verificar o exemplo de "inaceitável" antes do seminário.'},
{chip:'FASE 6 · BRASIL',lit:5,h:`<div class="bar" style="border-color:var(--grn)"><div class="k" style="color:var(--grn)">E o Brasil?</div><h2>Sem lei geral, mas não sem regras</h2></div><div class="grid g2" style="margin-top:40px"><div class="card amb"><h3>PL 2338/2023 · marco legal</h3><p>Senado aprovou em 12/2024. Aguarda parecer na Câmara, com impasse sobre direitos autorais. <b>Conferir na véspera.</b></p></div><div class="card"><h3>PL 6237/2025</h3><p>Cria o Sistema Nacional de IA, com a ANPD como reguladora residual.</p></div><div class="card grn"><h3>Já vale hoje</h3><p>LGPD art. 20 (revisão de decisão automatizada) · CNJ Res. 615/2025 · TSE Res. 23.755/2026 (rótulo, deepfake proibido, chatbot não recomenda candidato)</p></div><div class="card"><h3>Fomento</h3><p>PBIA "IA para o Bem de Todos": R$ 23 bilhões previstos até 2028.</p></div></div>`,n:'Slide Brasil.'},
{chip:'FASE 6 · LINHA DO TEMPO',lit:5,h:`<h2>Marcos da regulação</h2><svg viewBox="0 0 1700 520" width="1700" height="520"><line x1="60" y1="260" x2="1640" y2="260" stroke="#1e3a66" stroke-width="8"/>${[['08/2024','AI Act em vigor',120,0],['12/2024','Senado aprova PL 2338',300,1],['03/2025','CNJ Res. 615',480,0],['09/2025','China: rotulagem',640,1],['12/2025','EUA: ordem executiva',800,0],['01/2026','Coreia: AI Basic Act',960,1],['03/2026','TSE: Res. 23.755',1110,0],['07/2026','UE adia alto risco',1260,1],['11/2026','HOJE',1390,0],['12/2027','UE: alto risco',1500,1],['08/2028','UE: produtos',1610,0]].map(([d,l,x,u])=>`<circle cx="${x}" cy="260" r="${l==='HOJE'?18:12}" fill="${l==='HOJE'?'#ffc34d':'#38d6f5'}"/><text x="${x}" y="${u?200:330}" text-anchor="middle" font-size="22" font-weight="800" fill="${l==='HOJE'?'#ffc34d':'#7be8ff'}">${d}</text><text x="${x}" y="${u?170:362}" text-anchor="middle" font-size="19" fill="#c8d6ee">${l}</text>`).join('')}</svg>`,n:'Desenho D5.'},
{chip:'FASE 6 · QUIZ',lit:5,h:`<div class="k">Quiz · pergunta 1 de 4</div>`+vote('Desde quando valem as regras de alto risco do AI Act para sistemas autônomos?',['08/2026','12/2027','2030','Já valem'],1),n:'Gabaritos: 1) B (12/2027). 2) PL 2338: C, aguarda parecer na Câmara. 3) TSE: B, chatbots proibidos de recomendar candidatos. 4) Água potável alto impacto: C, Coreia do Sul. Na versão final, as 4 perguntas ficam em sequência com placar. Tecla R revela a resposta.'},
{chip:'FASE 7 · OS CÚMPLICES',lit:6,h:video('V6','A porta dos fundos (35 s)'),n:'<b>Promotor:</b> "Se a ré age, alguém a contratou, instalou e deixou trabalhar. A acusação pede que o júri ouça também os cúmplices: as empresas."'},
{chip:'FASE 7 · A LACUNA',lit:6,h:`<h2>A IA entra antes da regra</h2><div style="margin-top:36px">${[['Grandes empresas dos EUA com política formal de IA',98,'#38d6f5','EY, 09/2026'],['…que já contornaram essa política',47,'#ff5d6c','EY'],['…que não detectam agentes de IA não autorizados',26,'#ff5d6c','EY'],['Empresas dos EUA que divulgam supervisão de IA no conselho',8,'#ffc34d','ISS, 03/2026'],['Conselhos brasileiros que usam IA e têm diretrizes formais',20.7,'#3ee6a8','IBGC/FGVethics, 04/2026'],['Empresas brasileiras com política formal de IA',14,'#3ee6a8','Totvs, 10/2026']].map(([l,v,c,s])=>`<div style="display:flex;align-items:center;gap:20px;margin-bottom:18px"><div style="width:720px;font-size:23px;color:#c8d6ee">${l}</div><div style="flex:1;height:38px;background:#10264a;border-radius:8px;position:relative"><div style="width:${v}%;height:100%;background:${c};border-radius:8px"></div></div><div style="width:110px;font-size:32px;font-weight:900;color:${c}">${String(v).replace('.',',')}%</div><div style="width:240px;font-size:17px;color:#8aa0c2">${s}</div></div>`).join('')}</div><p class="sub" style="font-size:22px">Pesquisas autodeclaradas, feitas por quem vende governança. EY: margem de ±7 p.p.</p>`,n:'Desenho D6.'},
{chip:'FASE 7 · QUEM FAZ DIREITO',lit:6,h:`<div class="grid g2" style="grid-template-columns:1fr 1fr;align-items:start"><div><div class="k" style="color:var(--grn)">A defesa responde</div><h2>Há quem faça direito</h2><div class="card grn" style="margin-top:20px"><h3>Serpro</h3><p>Política de IA aprovada pelo conselho, com rede de eticistas.</p></div><div class="card grn" style="margin-top:16px"><h3>TCU</h3><p>Portal público de práticas para outros órgãos.</p></div><div class="card grn" style="margin-top:16px"><h3>Normas prontas</h3><p>NIST AI RMF e ISO/IEC 42001.</p></div></div><div>${vote('Sua organização tem regra para usar IA?',['Tem e todos seguem','Tem, mas ninguém segue','Não tem','Não sei']).replace('<div class="qr">','<div class="qr" style="display:none">').replace('class="vw"','class="vw" style="margin-right:0"').replace('class="opts"','class="opts" style="grid-template-columns:1fr"')}</div></div>${knows('A IA entra pela porta dos fundos antes de a empresa ter regra, dono e treinamento.')}`,n:'Comparar a votação com o gráfico da lacuna.'},
{chip:'FASE 8 · DEBATES',lit:7,h:`<h2>Fora deste tribunal, a sociedade também está dividida</h2><div style="position:relative;width:1300px;height:640px;margin:20px auto 0"><div style="position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #5f7ba3"></div><div style="position:absolute;top:50%;left:0;right:0;border-top:2px solid #5f7ba3"></div><div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#0b1a33;padding:0 12px;color:#9fb3d1;font-weight:800">ACELERAR ↑</div><div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#0b1a33;padding:0 12px;color:#9fb3d1;font-weight:800">↓ FREAR</div><div style="position:absolute;left:0;top:50%;transform:translateY(-130%);color:#9fb3d1;font-weight:800">← PRESENTE</div><div style="position:absolute;right:0;top:50%;transform:translateY(-130%);color:#9fb3d1;font-weight:800">FUTURO →</div><div class="card" style="position:absolute;left:40px;top:60px;width:560px"><h3 style="color:var(--cy2)">Céticos do "hype"</h3><p>O valor prometido não aparece: só ~6% das empresas são "alto desempenho" em IA (McKinsey).</p></div><div class="card amb" style="position:absolute;right:40px;top:60px;width:560px"><h3>Otimistas</h3><p>Regular cedo trava saúde, ciência e produtividade e entrega a liderança a outros.</p></div><div class="card vio" style="position:absolute;left:40px;bottom:50px;width:560px"><h3>Ética e danos presentes</h3><p>Viés, desinformação, trabalho e poder concentrado: proteger quem é afetado hoje.</p></div><div class="card red" style="position:absolute;right:40px;bottom:50px;width:560px"><h3>Segurança e riscos extremos</h3><p>Sistemas autônomos podem fugir do controle. Bengio copreside o painel da ONU.</p></div></div>`,n:'Desenho D7. Dinâmica: 2 voluntários na promotoria e 2 na defesa, 1 min cada; troca de toga de 30 s (primeiro corte se atrasar). O juiz não declara vencedor.'},
{chip:'FASE 9 · O QUE O JÚRI JÁ SABE',lit:7,h:`<h2>Antes de votar, o que o júri já sabe</h2><ol style="font-size:27px;line-height:1.55;margin-top:24px;color:#eaf2ff">${['Governança é dono e regra; ética é o certo; responsabilidade é quem responde.','Os danos já estão registrados. Não são ficção científica.','Ver já não é crer. E a IA erra com toda a confiança.','A mesma IA que engana também salva. A diferença está no uso.','A IA não responde por nada. Quem a usa responde por tudo.','O mundo regula por risco, mas adia prazos. O Brasil regula por setor.','A IA entra pela porta dos fundos antes de a empresa ter regra.','Não há consenso sobre o futuro, mas há sobre uma coisa: alguém precisa responder.'].map(x=>`<li>${x}</li>`).join('')}</ol>`,n:'Ler devagar.'},
{chip:'FASE 9 · QUESITOS',lit:7,h:`<h2>Os quesitos: 5 critérios de governança</h2><div class="grid" style="grid-template-columns:repeat(5,1fr);margin-top:40px">${[['Dono','há alguém responsável?'],['Política','há regra escrita?'],['Inventário','sabe quais IAs usa?'],['Revisão humana','alguém confere?'],['Transparência','o afetado sabe?']].map(([a,b],i)=>`<div class="card" style="text-align:center"><div style="font-size:54px;font-weight:900;color:var(--cy2)">${i+1}</div><h3>${a}</h3><p>${b}</p></div>`).join('')}</div><table style="margin-top:44px;font-size:25px;width:100%;border-collapse:collapse">${[['Petição fantasma','Revisão humana'],['Fraude com deepfake','Transparência e confirmação interna'],['Ataque quase sem humano','Dono e inventário'],['Conta de luz','Política: IA onde compensa']].map(([a,b])=>`<tr><td style="padding:10px;border-bottom:1px solid var(--line);color:#ff8a95;font-weight:700">${a}</td><td style="padding:10px;border-bottom:1px solid var(--line)">faltou → <b style="color:var(--amb)">${b}</b></td></tr>`).join('')}</table><p style="font-size:18px;color:#8aa0c2">Quadro: interpretação da equipe.</p>`,n:'Apresentar o quadro como interpretação.'},
{chip:'FASE 9 · VOTAÇÃO 2',lit:7,h:vote('A IA ajuda mais ou ameaça mais?',['Ajuda mais','Ameaça mais','Depende de como é governada','Cedo demais para saber'])+`<p class="sub" style="margin-top:26px">Na versão final: resultado lado a lado com a Votação 1.</p>`,n:'Se não mudar em relação à 1, diga com naturalidade que a turma já entrou pensando em governança.'},
{chip:'FASE 9 · SENTENÇA',lit:7,h:`<div class="k" style="color:var(--amb)">Sentença</div><h1 style="font-size:96px">LIBERDADE VIGIADA</h1><blockquote>A ré causou danos reais e entregou benefícios reais. A culpa não é da ferramenta: é de quem a usa sem dono, sem regra e sem revisão. A vigilância tem nome: <span style="color:var(--cy2)">governança</span>.</blockquote>`,n:'Ler a sentença em voz pausada. Batida de martelo.'},
{chip:'FASE 10 · E NA NOSSA CASA?',lit:7,h:video('V7','A chamada (34 s)'),n:'Rodar V7.'},
{chip:'FASE 10 · O PRIMEIRO PASSO',lit:7,h:`<div class="bar"><div class="k">E na nossa casa?</div><h2>A sentença vale também para as estatais</h2><p class="sub">A Lei 13.303 já exige gestão de riscos e integridade. Na COGERH, a IA já é usada de forma pontual, sem regra comum (percepção do grupo). Não é acusação: é ponto de partida.</p></div><h3 style="font-size:34px;margin:40px 0 20px;color:var(--amb)">O primeiro passo cabe numa página</h3><div class="grid" style="grid-template-columns:repeat(5,1fr)">${['Política curta de uso','Inventário','Revisão humana','Capacitação','Canal de dúvidas'].map((x,i)=>`<div class="card amb" style="text-align:center"><div style="font-size:48px;font-weight:900;color:var(--amb)">${i+1}</div><p style="font-size:26px;color:#eaf2ff;font-weight:700">${x}</p></div>`).join('')}</div>`,n:'A frase sobre a COGERH é percepção do grupo, não diagnóstico oficial.'},
{chip:'FASE 11 · ENCERRAMENTO',lit:7,h:`<div style="display:flex;gap:60px;align-items:center;margin-top:30px"><div style="flex:1"><div class="k">Está encerrada a sessão</div><h1>A ré sai daqui vigiada.<br><span style="color:var(--cy2)">Nós também.</span></h1><p class="sub" style="margin-top:40px">Perguntas?</p><p style="font-size:20px;color:#8aa0c2;margin-top:40px;line-height:1.6">Referências principais: EY (2026) · ISS (2026) · IBGC/FGVethics (2026) · Totvs (2026) · Regulamento UE 2024/1689 e Digital Omnibus · PL 2338/2023 · Res. CNJ 615/2025 · Res. TSE 23.755/2026 · IEA · FMI · OIT · Stanford AI Index 2026 · AI Incident Database · OCDE · UNESCO</p></div>${orb(420)}</div>`,n:'QR code para o dossiê completo na versão final.'}

const root=document.getElementById('slides');root.innerHTML=S.map(s=>`<section class="slide">${s.h}</section>`).join('');
const sl=[...document.querySelectorAll('.slide')];let cur=0;
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
function go(i){i=Math.max(0,Math.min(S.length-1,i));sl[cur].classList.remove('on');sl[cur].querySelectorAll('video').forEach(v=>v.pause());cur=i;sl[cur].classList.add('on');
 const s=S[cur];document.getElementById('chip').textContent=s.chip;document.getElementById('num').textContent=`${cur+1} / ${S.length}`;
 const L=lit(s.lit),now=L[L.length-1];document.getElementById('autos').innerHTML=SELOS.map(([k,l])=>`<div class="selo${L.includes(k)?' lit':''}${k===now?' now':''}">${l}</div>`).join('');
 document.getElementById('notes').innerHTML=`<b>Notas do apresentador · slide ${cur+1}</b><br>${s.n||''}`;
 try{history.replaceState(null,'','#s'+(cur+1))}catch(e){}
 if(s.chip.includes('NUVEM'))cloud();}
function tally(el){const c=el.querySelector('.c');c.textContent=+c.textContent+1;const all=[...el.parentNode.children];const tot=all.reduce((a,o)=>a+ +o.querySelector('.c').textContent,0);all.forEach(o=>o.querySelector('.fill').style.width=(100*o.querySelector('.c').textContent/tot)+'%');}
function cloud(){const w=[['curiosidade',90],['medo',72],['praticidade',64],['dúvida',52],['esperança',48],['preguiça',36],['controle',34],['futuro',44],['risco',40],['ajuda',58]];document.getElementById('cloud').innerHTML=w.map(([t,s])=>`<span style="font-size:${s}px;opacity:${.5+s/180}">${t}</span>`).join('')+'<div style="width:100%;text-align:center;font-size:18px;color:#8aa0c2">exemplo fictício</div>';}
let tm=null;function timer(){const el=document.getElementById('timer');if(tm){clearInterval(tm);tm=null;el.style.display='none';return;}let n=40;el.style.display='block';el.textContent=n;tm=setInterval(()=>{n--;el.textContent=n;if(n<=0){clearInterval(tm);tm=null;setTimeout(()=>el.style.display='none',1500);}},1000);}
document.getElementById('index').innerHTML=S.map((s,i)=>`<div onclick="go(${i});toggle('index')">${i+1}. ${s.chip}</div>`).join('');
function toggle(id){const e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block';}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowright'||k===' '||k==='pagedown'){e.preventDefault();go(cur+1)}else if(k==='arrowleft'||k==='pageup')go(cur-1);else if(k==='n')toggle('notes');else if(k==='g')toggle('index');else if(k==='t')timer();else if(k==='r')document.querySelectorAll('.slide.on .opt.ans').forEach(o=>o.classList.add('right'));else if(k==='f'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}}});
const h=parseInt((location.hash||'').replace('#s',''));go(isNaN(h)?0:h-1);
</script></body></html>
